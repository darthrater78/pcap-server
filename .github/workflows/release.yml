name: Release

on:
  push:
    tags:
      - 'v*'

# One release at a time, across every tag. Two releases running together would
# race each other to :dev, and the one that finished last would win whether or
# not it was the newer version. Queued rather than cancelled: a release that
# was already publishing must never be stopped halfway, leaving an image pushed
# with no GitHub release behind it.
concurrency:
  group: release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Nothing but habit stopped a red commit reaching :dev. This workflow builds
  # and publishes on a tag push and ran no tests at all, so a tag on a commit
  # whose Check went red published exactly the same way a green one did.
  #
  # Re-running the suite here instead would add ~8 minutes to every release
  # (Check took 8m13s on dev.35) to re-prove what the branch push already
  # proved. So this asks the API about the run that already exists, keyed on
  # the commit the tag points at.
  #
  # That key is the right one because of how this repo releases: the tag is
  # pushed at the branch head, so the tag's commit and the branch push's commit
  # are the same SHA. check.yml deliberately does not run on tag pushes
  # (branches: ['**'], added in dev.34), which is why there is a run to look up
  # rather than one about to start alongside this job.
  #
  # A passing Check is not enough on its own, because check.yml runs on every
  # branch -- Dependabot's included. A tag on a commit that only ever existed on
  # a side branch would find a green run and publish, and could move :dev to
  # something that was never merged. So the gate first requires the tagged
  # commit to be on the default branch.
  gate:
    runs-on: ubuntu-latest
    # The Check wait below gives up at 30 minutes; this is that plus room for
    # the runner itself, so the step's own message is what a timeout shows.
    timeout-minutes: 40
    permissions:
      actions: read
      contents: read
    steps:
      - name: Require the tagged commit to be on the default branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          # compare/<tag commit>...<default branch> reports how the branch
          # stands relative to the commit. "identical" (the commit is the head)
          # or "ahead" (the branch has moved on past it) both mean the commit is
          # in the branch's history. "behind" and "diverged" mean it is not.
          status=$(gh api "repos/${REPO}/compare/${SHA}...${DEFAULT_BRANCH}" --jq '.status')

          case "$status" in
            identical|ahead)
              echo "${SHA} is on ${DEFAULT_BRANCH} (${status})."
              ;;
            *)
              echo "::error::${SHA} is not on ${DEFAULT_BRANCH} (compare status: ${status}). Refusing to publish a commit that was never merged."
              exit 1
              ;;
          esac

      # v1.0.0 was first pushed onto the dev.40 commit, before the release PR
      # merged. That commit was on main and its Check was green, so both checks
      # around this one passed, and :1.0.0 and :latest were published holding
      # code that called itself 0.1.0-dev.40. The tag names a version; the
      # commit has to be that version.
      - name: Require the tag to match APP_VERSION in the tagged commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          app_version=$(gh api -H 'Accept: application/vnd.github.raw' \
            "repos/${REPO}/contents/backend/main.py?ref=${SHA}" \
            | sed -n 's/^APP_VERSION = "\([^"]*\)"$/\1/p')

          if [ -z "$app_version" ]; then
            echo "::error::No APP_VERSION line found in backend/main.py at ${SHA}. Refusing to publish a version nothing declares."
            exit 1
          fi

          if [ "v${app_version}" != "$TAG" ]; then
            echo "::error::Tag ${TAG} is on a commit whose APP_VERSION is ${app_version}. Refusing to publish. Merge the release first, then tag the merged commit."
            exit 1
          fi

          echo "${TAG} matches APP_VERSION ${app_version} at ${SHA}."

      - name: Require a passing Check run for this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # One line per Check run for a commit: "<status> <conclusion> <url>".
          # Shaped by gh's own --jq rather than piping into jq(1), so this step
          # depends on one tool instead of two.
          check_runs_for() {
            gh api \
              "repos/${REPO}/actions/workflows/check.yml/runs?head_sha=$1&per_page=100" \
              --jq '.workflow_runs[] | "\(.status) \(.conclusion) \(.html_url)"'
          }

          # The same lookup restricted to push runs, for the ancestor search
          # below. On a push, checkout takes the commit itself, so the run's
          # verdict is about that tree. On a pull_request it takes the merge
          # ref instead -- head_sha names the PR head, but what ran was the
          # head merged into the base. That distinction does not matter for the
          # tagged commit (a merge commit's own push run tests exactly the tree
          # being published, which is why the loop below is left as it was),
          # but it is the whole claim the ancestor search rests on.
          push_runs_for() {
            gh api \
              "repos/${REPO}/actions/workflows/check.yml/runs?head_sha=$1&event=push&per_page=100" \
              --jq '.workflow_runs[] | "\(.status) \(.conclusion) \(.html_url)"'
          }

          passed() {
            awk '$2 == "success" { hit = 1 } END { exit !hit }'
          }

          # check.yml declines to run at all for a commit that touches only
          # paths it provably does not read -- README.md, CHANGELOG.md, docs/,
          # .claude/, .github/workflows/. Merge such a commit and tag it, as
          # v1.1.0-beta.2 was tagged on the merge of its own handoff notes, and
          # the lookup above finds nothing and this gate refuses a release
          # whose code had in fact been tested. The tagged tree and the tested
          # tree differed in two .claude/ files: nothing a test opens, and
          # nothing that reaches the image either (the Dockerfile copies
          # backend/, frontend/ and entrypoint.sh, and nothing else).
          #
          # So a commit with no run of its own is not refused outright. Find
          # the nearest ancestor that has a passing one, and require everything
          # that changed between them to fall inside check.yml's own
          # paths-ignore list. That is the same claim check.yml makes when it
          # skips a commit, applied one commit later, and it is the narrowest
          # thing that can be said without running the suite.
          #
          # Everything this cannot establish refuses the release: no tested
          # ancestor within reach, an ignore list it cannot read, a pattern it
          # cannot reason about, or a compare too large to read in full. A
          # commit whose own Check ran and FAILED never arrives here -- that is
          # a real failure and is handled below, not explained away by an
          # ancestor.
          accept_tested_ancestor_or_die() {
            local patterns pattern base candidate depth changed file prefix matched

            # Read the ignore list out of check.yml at the tagged commit rather
            # than restating it here, so the two cannot drift apart. The first
            # sed takes the blocks, the second unwraps each list item.
            #
            # Blocks, plural: check.yml carries the same list twice, once under
            # push and once under pull_request, because GitHub Actions has no
            # YAML anchors to define it once. sed's range restarts on the second
            # `paths-ignore:`, so both are read and sort -u collapses them. A
            # duplicate would match the same file twice and change nothing, but
            # it would show up twice in this step's own output.
            patterns="$(
              gh api -H 'Accept: application/vnd.github.raw' \
                "repos/${REPO}/contents/.github/workflows/check.yml?ref=${SHA}" \
                | sed -n '/^[[:space:]]*paths-ignore:[[:space:]]*$/,/^[[:space:]]*[a-z_-]*:/p' \
                | sed -n "s/^[[:space:]]*-[[:space:]]*['\"]\{0,1\}\([^'\"]*\)['\"]\{0,1\}[[:space:]]*\$/\1/p" \
                | sort -u
            )"

            if [ -z "$patterns" ]; then
              echo "::error::Check has no run for ${SHA}, and check.yml's paths-ignore list could not be read at that commit -- so there is no way to tell what skipping it would have meant. Refusing to publish."
              exit 1
            fi

            # Two pattern shapes are understood: an exact path, and a directory
            # glob ending in /**. Anything else is not guessed at, because the
            # per-file comparison below would silently under-report what a
            # pattern it mis-read had actually covered.
            while read -r pattern; do
              [ -n "$pattern" ] || continue
              case "$pattern" in
                */'**') ;;
                *'*'*|*'?'*|*'['*)
                  echo "::error::check.yml's paths-ignore contains ${pattern}, a pattern this gate cannot reason about. Run Check by hand against ${SHA} (Actions -> Check -> Run workflow) and re-run this release."
                  exit 1
                  ;;
              esac
            done <<< "$patterns"

            # FIRST parents only, one commit at a time.
            #
            # This used to read /commits?sha=, which follows every parent in
            # date order -- so a merged PR's own commits were interleaved with
            # the default branch's. That was harmless while check.yml ran on
            # every branch, because those commits had push runs of their own.
            # It stopped being harmless when check.yml narrowed its push
            # trigger to main: a PR long enough to fill the window would leave
            # this refusing a release for want of looking one commit further
            # back along main, at a commit that did have a run.
            #
            # First-parent from a merge commit is the previous head of the
            # default branch, so 20 steps is 20 of ITS commits, not 20 of
            # anyone's. The realistic depth is one -- a docs-only merge sitting
            # directly on a tested one.
            base=""
            candidate="${SHA}"
            depth=0
            while [ "$depth" -lt 20 ]; do
              depth=$(( depth + 1 ))
              # // empty rather than a null, so a root commit ends the walk
              # instead of turning into the string "null" and 404ing next time.
              candidate="$(gh api "repos/${REPO}/commits/${candidate}" --jq '.parents[0].sha // empty')"
              [ -n "$candidate" ] || break
              if push_runs_for "$candidate" | passed; then
                base="$candidate"
                break
              fi
            done

            if [ -z "$base" ]; then
              echo "::error::Check has no run for ${SHA}, and none of its 20 nearest first-parent ancestors has a passing push run either. Nothing establishes that this tree was ever tested. Run Check by hand against ${SHA} (Actions -> Check -> Run workflow) and re-run this release."
              exit 1
            fi

            # compare returns at most 300 entries in .files. A change that
            # large is not a docs commit, and a truncated list would read as
            # though the part that fit were the whole change -- so the count is
            # checked rather than trusted.
            # No `?` after .files: a response without that key is a
            # response this cannot read, and jq erroring out of it fails the
            # step rather than reading as "nothing changed".
            changed="$(gh api "repos/${REPO}/compare/${base}...${SHA}" --jq '.files[].filename')"
            if [ "$(printf '%s\n' "$changed" | awk 'NF' | wc -l)" -ge 300 ]; then
              echo "::error::${base}...${SHA} changes 300 or more files; the compare API truncates there and this gate will not reason about a partial list. Run Check by hand against ${SHA} and re-run this release."
              exit 1
            fi

            while read -r file; do
              [ -n "$file" ] || continue
              matched=""
              while read -r pattern; do
                [ -n "$pattern" ] || continue
                case "$pattern" in
                  */'**')
                    prefix="${pattern%'**'}"
                    if [ "${file#"$prefix"}" != "$file" ]; then
                      matched=yes
                    fi
                    ;;
                  *)
                    if [ "$file" = "$pattern" ]; then
                      matched=yes
                    fi
                    ;;
                esac
              done <<< "$patterns"

              if [ -z "$matched" ]; then
                echo "::error::Check has no run for ${SHA}, and it differs from the last tested commit ${base} in ${file}, which check.yml does not skip. Refusing to publish code nothing has tested."
                exit 1
              fi
            done <<< "$changed"

            if [ -z "$(printf '%s\n' "$changed" | awk 'NF')" ]; then
              echo "Check has no run for ${SHA}, but ${base} passed and the two trees are identical."
            else
              echo "Check has no run for ${SHA}, but ${base} passed and every difference between them is a path check.yml skips:"
              printf '%s\n' "$changed" | awk 'NF' | sed 's/^/  /'
            fi
          }

          # Tagging straight after pushing the branch is the normal thing to
          # do, and Check takes minutes -- so an in-progress run is waited on
          # rather than treated as a failure. The deadline is generous against
          # an 8-minute suite; exceeding it fails the release rather than
          # publishing something whose tests never finished.
          deadline=$(( $(date +%s) + 1800 ))

          while true; do
            runs="$(check_runs_for "${SHA}")"

            if [ -z "$runs" ]; then
              echo "Check has never run for ${SHA} -- looking for a tested ancestor."
              accept_tested_ancestor_or_die
              exit 0
            fi

            if printf '%s\n' "$runs" | passed; then
              echo "Check passed for ${SHA}."
              exit 0
            fi

            unfinished=$(printf '%s\n' "$runs" | awk '$1 != "completed"' | wc -l)
            if [ "$unfinished" -eq 0 ]; then
              echo "::error::Check ran for ${SHA} and did not pass. Refusing to publish."
              printf '%s\n' "$runs" | sed 's/^/  /' >&2
              exit 1
            fi

            echo "Check is still running for ${SHA} (${unfinished} unfinished) -- waiting."

            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::Timed out waiting for Check on ${SHA} to finish."
              exit 1
            fi
            sleep 20
          done

  release:
    needs: gate
    runs-on: ubuntu-latest
    # A normal run takes about a minute and a half. A hung registry push should
    # fail in minutes, not hold the release queue above for six hours.
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write

    # Every action is pinned to a commit SHA rather than a moving major tag.
    # This job holds `contents: write` and `packages: write`: a tag an action's
    # owner can move is a tag someone who compromises that repo can move onto
    # code that reads those tokens, and every release from then on would pull
    # it without a single line changing here. The trailing comment is the
    # human-readable version; dependabot (github-actions, .github/dependabot.yml)
    # bumps both together, so pinning does not mean going stale.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing after checkout pushes with git, so the token is not left in
          # .git/config for every later step (build-push included) to read.
          # The one git call below, ls-remote, runs anonymously; this repo is
          # public.
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive release metadata from tag
        id: meta
        env:
          # Read through the environment rather than a ${{ }} template so the
          # tag name is never expanded into the script text.
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          version="${TAG#v}"
          image="${REGISTRY}/${IMAGE_NAME}"

          # Every version tag on the remote, oldest first.
          #
          # Failure here aborts the release rather than falling through to a
          # guess: not knowing what else is tagged is exactly the state in which
          # moving a floating tag is unsafe.
          remote_versions="$(git ls-remote --tags origin 'refs/tags/v*' \
            | sed 's#.*refs/tags/v##' | grep -v '\^{}$')"

          # The tag that started this run is normally in that list already --
          # its push is the trigger -- but it is added explicitly rather than
          # assumed. If the ref were not yet visible to ls-remote, a release
          # would compare itself against only its predecessors, conclude it was
          # not the newest, and quietly decline to move :dev. Declining is the
          # safe direction for an old tag and the wrong one here, so the one
          # version this run knows for certain is never left to a lookup.
          versions="$(printf '%s\n%s\n' "$remote_versions" "$version" \
            | awk 'NF' | sort -V -u)"

          # A floating tag must only ever move forward. Nothing about a tag push
          # says it is the newest version: backfilling a version that was
          # skipped, or re-tagging an old commit, pushes an older build through
          # this same workflow. Without this check that build would claim :dev
          # or :latest and silently downgrade whoever pulls them.
          #
          # Compare within a kind -- newest dev against dev, newest stable
          # against stable -- so a stable release does not stop :dev tracking
          # dev builds. This also sidesteps sort -V ordering a prerelease after
          # its own release (it places 0.1.0 before 0.1.0-dev.2), which is wrong
          # by semver but never consulted across kinds.
          newest_dev="$(printf '%s\n' "$versions" | { grep -- '-dev' || true; } | tail -n1)"
          newest_stable="$(printf '%s\n' "$versions" | { grep -v -- '-' || true; } | tail -n1)"

          tags="${image}:${version}"
          moving=""

          if [[ "$version" == *-dev* ]]; then
            prerelease=true
            release_name="v${version} (Dev)"
            if [ "$version" = "$newest_dev" ]; then
              moving=":dev"
              tags="${tags}"$'\n'"${image}:dev"
            else
              echo "::notice::v${version} is not the newest dev version (v${newest_dev}) -- leaving :dev pointing where it is"
            fi
          elif [[ "$version" == *-* ]]; then
            # Other prereleases (-rc, -beta) carry no floating tag by design.
            prerelease=true
            release_name="v${version} (Pre-release)"
          else
            prerelease=false
            release_name="v${version}"
            if [ "$version" = "$newest_stable" ]; then
              moving=":latest"
              tags="${tags}"$'\n'"${image}:latest"
            else
              echo "::notice::v${version} is not the newest stable version (v${newest_stable}) -- leaving :latest pointing where it is"
            fi
          fi

          echo "Building v${version}; pushing ${image}:${version}${moving:+ and ${image}${moving}}"

          {
            echo "version=$version"
            echo "prerelease=$prerelease"
            echo "release_name=$release_name"
            echo "tags<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # Built into the runner's own daemon first, NOT pushed. Everything below
      # this point used to be one build-push step: `docker build` exiting 0 was
      # the only thing between a broken image and GHCR. The suite proves the
      # code; nothing proved the artifact. A missing COPY, a dependency the
      # venv has and the image does not, a bad edit to entrypoint.sh -- each
      # builds clean and dies on start, and every release record in
      # .claude/dev-skills-gates.md that caught one of those caught it by hand,
      # locally, before tagging. CI never did.
      #
      # Single-platform, so `load: true` works; this repo has never set
      # `platforms:`, and a multi-arch build could not be loaded into the local
      # daemon at all.
      - name: Build the image for the smoke test
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          tags: pcap-server-smoke:${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Prove the image runs before publishing it
        env:
          IMAGE: pcap-server-smoke:${{ steps.meta.outputs.version }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail

          work="$(mktemp -d)"
          cid=""

          # Always show the container's own log on the way out. A smoke failure
          # with no log is a re-run to find out what happened.
          cleanup() {
            if [ -n "$cid" ]; then
              echo "::group::container log"
              docker logs "$cid" 2>&1 || true
              echo "::endgroup::"
              docker rm -f "$cid" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup EXIT

          # A real throwaway key rather than ALLOW_UNENCRYPTED_CAPTURES: the
          # encryption path is what docker-compose.yml actually ships, so it is
          # the one worth proving boots.
          head -c 32 /dev/urandom | base64 > "$work/master.key"

          # No bind mounts for data/, captures/ or ssh-keys/. The Dockerfile
          # already creates them owned by appuser, and mounting host
          # directories instead is how an earlier by-hand smoke run failed for
          # reasons that had nothing to do with the image (root-owned mount
          # sources, and entrypoint.sh keys its chown off those same vars).
          cid=$(docker run -d -p 18080:8080 \
            -e MASTER_KEY_FILE=/run/secrets/master.key \
            -v "$work/master.key:/run/secrets/master.key:ro" \
            "$IMAGE")

          # Up to 60s. A cold start is a couple of seconds; anything near the
          # deadline is itself worth knowing about.
          deadline=$(( $(date +%s) + 60 ))
          until code=$(curl -fsS -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/ 2>/dev/null) \
             && [ "$code" = "200" ]; do
            if ! docker inspect -f '{{.State.Running}}' "$cid" 2>/dev/null | grep -q true; then
              echo "::error::The container exited before serving anything."
              exit 1
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::The image never served / within 60s."
              exit 1
            fi
            sleep 2
          done
          echo "/ answered 200."

          # The auth gate is wired, not just the process alive: a public route
          # answers, a protected one refuses.
          # No -f here or below: curl exits non-zero on a 4xx/5xx with it, and
          # under `set -e` that aborts the step with curl's error instead of
          # the message naming the code we actually got.
          status=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/api/auth/status)
          [ "$status" = "200" ] || { echo "::error::/api/auth/status returned ${status}, want 200."; exit 1; }

          servers=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/api/servers)
          [ "$servers" = "401" ] || { echo "::error::/api/servers returned ${servers} unauthenticated, want 401."; exit 1; }
          echo "Auth gate wired: /api/auth/status 200, /api/servers 401."

          # What the tag claims, checked against the code INSIDE the image
          # rather than against the repo. The gate job already compared the tag
          # with APP_VERSION at the tagged commit; this is the independent
          # half -- it catches a Dockerfile that copied the wrong tree, which
          # a source-level check cannot see. v1.0.0 once published code
          # reporting 0.1.0-dev.40, and this is the layer that would have
          # caught it even if the tag had been right.
          in_image=$(docker exec "$cid" sed -n 's/^APP_VERSION = "\([^"]*\)"$/\1/p' /app/backend/main.py)
          if [ "$in_image" != "$VERSION" ]; then
            echo "::error::The image reports APP_VERSION ${in_image}, but this release is ${VERSION}."
            exit 1
          fi
          echo "In-image APP_VERSION is ${in_image}."

          # A route can answer 200 while the app logs a stack trace behind it.
          log="$(docker logs "$cid" 2>&1)"
          if printf '%s\n' "$log" | grep -q 'Traceback (most recent call last)'; then
            echo "::error::The image logged a traceback during startup."
            exit 1
          fi

          # Proves the vault actually opened, rather than the app having fallen
          # back to running unencrypted.
          if ! printf '%s\n' "$log" | grep -qi 'encryption enabled'; then
            echo "::error::The image did not report encryption enabled; the vault did not open."
            exit 1
          fi

          echo "Smoke test passed for ${IMAGE}."

      # Cache-hit rebuild of the exact tree just smoke-tested, so this is
      # seconds rather than a second full build. cache-to lives on the build
      # above; repeating it here would just race that export.
      - name: Build and push image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: ${{ steps.meta.outputs.release_name }}
          generate_release_notes: true
          prerelease: ${{ steps.meta.outputs.prerelease }}
