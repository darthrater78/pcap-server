name: Check

on:
  # The default branch only, and no tags.
  #
  # Tags: a bare `push:` also matches a tag push, which is exactly what fires
  # release.yml -- so tagging a commit this same Check already passed on ran
  # the whole suite a second time against nothing new. Tags carry no ref under
  # refs/heads, so naming branches here excludes them without repeating
  # release.yml's own 'v*' pattern.
  #
  # Other branches: this was ['**'], which meant a commit pushed to a branch
  # with an open PR ran the full suite TWICE against the same tree -- once as
  # `push`, once as `pull_request`. Both runs take about ten minutes. PR #14's
  # branch shows the pair: runs 134 (push) and 135 (pull_request), one SHA.
  # `pull_request:` below covers branch work, so this trigger now exists for
  # exactly one reason: release.yml's gate looks up a **push** run on the
  # commit a tag points at, and tags only ever land here.
  #
  # The cost is that a branch with no PR open gets no Check. Open a draft PR,
  # or use the workflow_dispatch below.
  push:
    branches: [main]
    # Nothing in this suite reads README.md, docs/**, or CHANGELOG.md --
    # checked, not assumed -- and .claude/ is session scratch, so a push
    # touching only those already gets no coverage whether or not this runs.
    # .github/workflows/** is excluded too, now that lint-workflows.yml gives
    # it a real, purpose-built check of its own (actionlint: YAML syntax,
    # expression/context correctness, a shellcheck pass over `run:` blocks).
    # That check is static analysis, not execution, so it is NOT a full
    # substitute for this job actually running check.yml's steps -- it would
    # not catch e.g. a typo'd script path in the "Run tests" step. What it
    # does cover is the much more common mistake for a workflow edit: broken
    # YAML, a bad expression, an undefined context.
    paths-ignore:
      - 'README.md'
      - 'CHANGELOG.md'
      - 'docs/**'
      - '.claude/**'
      - '.github/workflows/**'
  # The same ignore list as the push trigger, and it has to be written out
  # again: GitHub Actions does not support YAML anchors, so there is no way to
  # define it once. Without this the two triggers disagreed -- a `.claude/`-only
  # commit was correctly skipped on push and then ran the full ten-minute suite
  # on the PR anyway. Runs 139 and 140 on 2026-09-18 are that, twice, for two
  # commits that between them changed one bookkeeping file.
  #
  # tests/test_release_workflow.py asserts the two lists stay identical, since
  # nothing else would notice them drifting apart.
  #
  # NOTE: if Check is ever made a required status check on main, a PR whose
  # every file is in this list reports no run at all and sits on "Expected --
  # waiting for status" forever. The fix then is a skip job reporting the same
  # check name, not deleting this filter.
  pull_request:
    paths-ignore:
      - 'README.md'
      - 'CHANGELOG.md'
      - 'docs/**'
      - '.claude/**'
      - '.github/workflows/**'
  # The escape hatch release.yml's gate points at. That gate refuses to publish
  # a commit Check has never run for, and paths-ignore above means a commit
  # touching only docs can be exactly that commit. Running Check by hand on the
  # branch gives it the run it is looking for, keyed on the branch head's SHA.
  workflow_dispatch:

# Supersede a running suite when the same ref is pushed again -- three commits
# in quick succession used to run three full suites to completion, none of them
# about the tree that ended up on the branch.
#
# Except on main, where a run is never cancelled. release.yml's gate asks for a
# passing Check run on the commit a tag points at, and a cancelled run is not a
# passing one: cancelling here would strand a merge commit as untaggable until
# someone re-ran it by hand. Merges to main are rare enough that the saving is
# not worth that.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    # The suite takes about ten minutes. Without a limit a hung browser test
    # holds a runner for GitHub's six-hour default, and release.yml's gate
    # waits on it until its own deadline.
    timeout-minutes: 30
    # Declared explicitly rather than left to the repository default, which
    # can be read/write and would hand this job a token able to push code,
    # move tags and publish packages. Nothing here writes anything: it checks
    # out, installs, and runs the suite. release.yml's gate job trusts this
    # workflow's conclusion, so the less this token can do, the less a
    # compromised step here can reach.
    permissions:
      contents: read
    steps:
      # Pinned to commit SHAs, as release.yml's are, and for the same reason
      # at a smaller scale: this job's token is read-only, but release.yml
      # trusts its verdict, so a moved tag here could turn a red suite green.
      # Dependabot bumps the SHA and the comment together.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install tshark and tcpdump
        env:
          # wireshark-common's postinst asks an interactive debconf question
          # about non-root capture; this must be set or the install hangs.
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tshark tcpdump

      # The browser itself is not a pip package. Installed here rather than in
      # scripts/check.sh so that running the checks locally never downloads a
      # browser behind a developer's back -- the script reports what it found
      # and the suites skip with the remedy in the reason.
      #
      # From the same pinned file the suites use, so the browser revision this
      # downloads is the one that playwright expects. It means installing the
      # dependencies twice on a CI run -- once here, once into the venv
      # scripts/check.sh builds -- which is a cheaper price than a second place
      # holding a playwright version that can drift from the first.
      - name: Install chromium for the browser suites
        run: |
          python -m pip install -q -r backend/requirements-dev.txt
          python -m playwright install --with-deps chromium

      - name: Run tests
        run: ./scripts/check.sh
